<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任務島 Task Island</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="login-shell" id="login-screen">
  <section class="login-card">
    <div class="login-emoji">🧸🏝️⭐</div>
    <p class="eyebrow">Welcome</p>
    <h1>登入任務島</h1>
    <p class="login-subtitle">填好名字，選一個身份，就可以進入你的小島。</p>
    <label class="login-label">名字<input id="login-name" type="text" placeholder="例如：Fang" /></label>
    <label class="login-label">Email / 資訊<input id="login-info" type="text" placeholder="可以填 Email 或暱稱" /></label>
    <div class="role-picker" id="role-picker">
      <button type="button" class="role-card active" data-role="學生">🎒<span>學生</span></button>
      <button type="button" class="role-card" data-role="社團幹部">🌟<span>社團幹部</span></button>
      <button type="button" class="role-card" data-role="上班族">💼<span>上班族</span></button>
      <button type="button" class="role-card" data-role="自由安排者">🌈<span>自由安排者</span></button>
    </div>
    <button class="primary-action login-submit" id="login-submit" type="button">🌈 進入我的小島</button>
  </section>
</main>
<main class="app-shell" id="app-screen" style="display:none;">
      <section class="phone-frame" aria-label="Task Island prototype">
        <header class="topbar">
          <button class="icon-btn" type="button" aria-label="開啟選單" title="開啟選單">
            <span></span><span></span><span></span>
          </button>
          <div>
            <p class="date-pill" id="today-date">今天</p>
            <h1>任務島 Task Island</h1>
          </div>
          <button class="avatar-btn" type="button" aria-label="個人檔案">F</button>
        </header>

        <nav class="mode-tabs" aria-label="主要頁籤">
          <button class="tab active" data-view="home" type="button">首頁</button>
          <button class="tab" data-view="tasks" type="button">任務</button>
          <button class="tab" data-view="addtask" type="button">新增</button>
          <button class="tab" data-view="focus" type="button">專注</button>
          <button class="tab" data-view="jar" type="button">星星瓶</button>
          <button class="tab" data-view="friends" type="button">好友</button>
          <button class="tab" data-view="buddy" type="button">圓圓聊天</button>
          <button class="tab" data-view="bag" type="button">背包</button>
          <button class="tab" data-view="stats" type="button">統計</button>
        </nav>

        <section class="view active" id="home-view">
          <div class="home-stack">
            <article class="panel island-card">
              <div class="island-topline">
                <div>
                  <p class="eyebrow">My Island</p>
                  <h2><span class="player-name">Fang</span> 的小島</h2>
                </div>
                <div class="resource-pills">
                  <div class="energy-pill">XP <span id="energy">0</span></div>
                  <div class="energy-pill star-pill"><span>⭐</span> <span id="stars">0</span></div>
                  <div class="energy-pill black-pill">黑星 <span id="black-stars">0</span></div>
                </div>
              </div>

              <div class="island-scene v2" id="island-scene">
                <div class="sky-layer" aria-hidden="true">
                  <span class="sun">🌞</span>
                  <span class="rainbow">🌈</span>
                  <span class="cloud cloud-a">☁️</span>
                  <span class="cloud cloud-b">☁️</span>
                  <span class="cloud cloud-c">☁️</span>
                </div>
                <div class="emoji-island">
                  <div class="water">💧 〰️ 💧</div>
                  <div class="island-land">
                    <span class="tree-e">🌳</span>
                    <span class="house-e">🏡</span>
                    <span class="flower-e">🌷</span>
                    <span class="bear-e" id="mini-buddy">🧸</span>
                    <span class="lamp-e">💡</span>
                  </div>
                </div>
              </div>
            </article>

            <div class="dashboard-grid">
              <article class="panel">
                <p class="eyebrow">Today</p>
                <h2>今日任務</h2>
                <div class="task-list" id="task-list"></div>
              </article>
              <article class="panel">
                <p class="eyebrow">Buddy</p>
                <h2>圓圓陪你</h2>
                <div class="buddy-mini">🧸</div>
                <button class="primary-action" id="focus-button" type="button">陪我專注 25 分鐘</button>
              </article>
            </div>
          </div>
        </section>

        <section class="view" id="tasks-view"><article class="panel"><h2>任務清單</h2><div class="task-list" id="deadline-list"></div></article></section>
        <section class="view" id="addtask-view"><article class="panel"><h2>新增任務</h2><input id="new-task-title" placeholder="輸入任務"/><input id="new-task-date" type="date"/><button class="primary-action" id="create-task" type="button">新增任務 ⭐</button></article></section>
        <section class="view" id="focus-view"><article class="panel"><h2>專注模式</h2><div class="focus-timer" id="focus-timer">25:00</div><button class="primary-action" id="focus-page-button" type="button">開始專注</button></article></section>
        <section class="view" id="jar-view"><article class="panel"><h2>星星瓶 ⭐</h2><div class="big-jar">⭐💫🌟<br><strong id="jar-total">0</strong></div></article></section>
        <section class="view" id="friends-view"><article class="panel"><h2>好友小島 💌</h2><div id="friend-list"></div></article></section>
        <section class="view" id="buddy-view"><article class="panel"><h2>圓圓聊天 🧸</h2><div id="chat-list"></div><input id="chat-input" placeholder="跟圓圓說話"/><button id="send-chat" class="primary-action">送出</button></article></section>
        <section class="view" id="bag-view"><article class="panel"><h2>背包 🎒</h2><div id="item-list"></div></article></section>
        <section class="view" id="stats-view"><article class="panel"><h2>統計 📊</h2><div id="calendar-grid"></div></article></section>

        <footer class="bottom-nav">
          <button class="nav-btn active" data-view="home" type="button">🏝️<span>小島</span></button>
          <button class="nav-btn" data-view="tasks" type="button">📝<span>任務</span></button>
          <button class="add-btn" data-view="jar" type="button" aria-label="星星瓶">⭐</button>
          <button class="nav-btn" data-view="friends" type="button">💌<span>好友</span></button>
          <button class="nav-btn" data-view="buddy" type="button">🧸<span>聊天</span></button>
          <button class="nav-btn" data-view="bag" type="button">🎒<span>背包</span></button>
        </footer>
      </section>
    </main>

    <div class="tutorial-overlay show" id="tutorial-overlay" aria-modal="true" role="dialog">
      <div class="tutorial-box" id="tutorial-box">
        <p class="eyebrow">Guide</p>
        <h2 id="tutorial-title">歡迎來到 Fang 的任務島</h2>
        <p id="tutorial-text">完成任務會獲得彩色星星，星星會飛進星星瓶。</p>
        <button class="primary-action" id="tutorial-next" type="button">開始經營小島</button>
      </div>
    </div>
    <div class="reward-modal" id="reward-modal" aria-hidden="true"><div class="reward-card"><button class="reward-close" id="reward-close" type="button">×</button><h2>任務完成！</h2><div class="reward-stars">⭐ ⭐ ⭐</div></div></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./jar.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
